name: 双平台桌面构建
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'k12/**'
      - 'static/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: K12-macOS
          - os: windows-latest
            artifact: K12-Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: 安装构建依赖
        run: python -m pip install -r tools/requirements-desktop.txt
      - name: 完整回归
        run: python -m unittest discover -s tests
      - name: 构建桌面包
        run: python tools/build_desktop.py
      - name: 打包并验证实际交付压缩包
        run: python tools/package_desktop.py
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error
